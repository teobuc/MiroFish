name: FABLE tests

on:
  push:
    branches: ["main"]
    paths: ["fable/**", ".github/workflows/fable-tests.yml"]
  pull_request:
    paths: ["fable/**", ".github/workflows/fable-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest anthropic

      - name: Compile check
        working-directory: fable
        run: python -m compileall -q src examples

      - name: Import check (no API key present)
        working-directory: fable
        run: python -c "import sys; sys.path.insert(0, 'src'); import fable"

      - name: Run offline test suite
        working-directory: fable
        run: python -m pytest tests -q
